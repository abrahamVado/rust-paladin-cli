[package]
name = "paladin"
version = "0.1.0"
edition = "2021"
description = "A local Rust CLI that uses Ollama/Gemma to generate safe Git commits from diffs."
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
colored = "2"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
